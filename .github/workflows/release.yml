name: Release installer

# Every tag that looks like v1.2.3 gets a release with:
#   PingLab-Setup-1.2.3.exe        per-user installer (no admin needed to install)
#   PingLab-1.2.3-portable.zip     the same app without an install step
#   SHA256SUMS.txt                 hashes for both
#
# A manual run re-builds a release for a tag that already exists.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, for example v1.0.0"
        required: true

# Third-party actions are pinned to the commit each tag pointed at when this file was
# written, not to a moving tag: a tag (or a compromised account behind it) can be moved
# without any commit here, and the workflow would silently run different code. Dependabot
# raises a pull request when a new release is available, so the pin is reviewed like code.
permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    # Only this job publishes, so only this job may write to the repository.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve version from tag
        id: version
        shell: pwsh
        # The tag is data, never code. A tag named v1.0.0'; Remove-Item ... must not become
        # part of this script, so it arrives through the environment and is only ever read
        # from there. It is then rejected unless it is exactly v<major>.<minor>.<patch>,
        # which is the format the installer's numeric version needs.
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_INPUT: ${{ inputs.tag }}
          TAG_REF: ${{ github.ref_name }}
        run: |
          $tag = if ($env:EVENT_NAME -eq 'workflow_dispatch') { $env:TAG_INPUT } else { $env:TAG_REF }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "No tag was given. A manual run needs a tag such as v1.0.0."
          }
          $tag = $tag.Trim()
          # \A..\z, not ^..$: .NET's $ also matches before a trailing newline, and an
          # output line must not be able to smuggle a second line past this check.
          if ($tag -notmatch '\Av(\d+\.\d+\.\d+)\z') {
            throw "Tag '$tag' must look like v1.2.3 (no suffix), because the installer version is numeric."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "number=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - name: Run every test suite
        shell: pwsh
        # The suite list lives in scripts/run-tests.mjs, so a test added next to a fix is run
        # here and in CI without being listed in two places.
        run: |
          node scripts/static-check.mjs
          node scripts/run-tests.mjs

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer and portable zip
        shell: pwsh
        # Same rule for the resolved number: digits only, and passed as an argument value
        # rather than pasted into the script text.
        env:
          VERSION_NUMBER: ${{ steps.version.outputs.number }}
        run: ./installer/build.ps1 -Version $env:VERSION_NUMBER -RequireInstaller

      # Signing is opt-in: without a certificate in the repository secrets the artifacts ship
      # unsigned and this step says so instead of failing a release. When it does sign, the
      # checksums are regenerated afterwards because signing changes the installer's bytes, and
      # a signature that does not verify stops the release here rather than at the user.
      - name: Sign the installer
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)) {
            Write-Host 'No signing certificate (SIGNING_PFX_BASE64); the release will be unsigned.'
            exit 0
          }
          $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $signtool = Get-ChildItem -Path (Join-Path $kits '*/x64/signtool.exe') -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe was not found in the Windows SDK on this runner.' }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          try {
            [System.IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            $signed = 0
            Get-ChildItem -Path (Join-Path $PWD 'dist') -Filter 'PingLab-Setup-*.exe' | ForEach-Object {
              & $signtool.FullName sign /f $pfx /p $env:SIGNING_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($_.Name)" }
              $signature = Get-AuthenticodeSignature $_.FullName
              if ($signature.Status -ne 'Valid') { throw "$($_.Name) did not verify after signing: $($signature.Status)" }
              Write-Host "signed: $($_.Name) ($($signature.SignerCertificate.Subject))"
              $signed += 1
            }
            if ($signed -eq 0) { throw 'No installer in dist to sign.' }
            # The published hashes have to describe the signed bytes, not the ones built a
            # moment earlier, and be the file verify-release.ps1 then reads back. One script
            # writes it for the build and for this step, so the two cannot drift apart.
            & ./installer/write-checksums.ps1 -Dist (Join-Path $PWD 'dist')
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }
      - name: Verify the artifacts match their checksums
        shell: pwsh
        # SHA256SUMS.txt has to describe the bytes actually being uploaded, not the ones the
        # build meant to produce.
        run: ./installer/verify-release.ps1

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: PingLab ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/PingLab-Setup-*.exe
            dist/PingLab-*-portable.zip
            dist/SHA256SUMS.txt
